name: Kork
run-name: Kork ${{ github.ref_name }} (${{ github.event_name }})

# Triggers intentionally disabled for Argus-OSS-Security.
# on:
#   workflow_dispatch:
# 
#   pull_request:
#     branches:
#       - main
#       - release-*
#     paths:
#       - 'kork/**'
#       - '.github/workflows/kork.yml'
# 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/generic-build-publish
        with:
          project: kork
          publish: false
          integration-test: false
          generate-sbom: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
